<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Customize Cake - Siffat Cakes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#fbf4fb;
      --text:#1d141f;
      --muted:#725a76;
      --purple:#640D6B;
      --purple2:#7a1281;
      --soft:#fff7ff;
      --line:rgba(100,13,107,.16);
      --shadow:0 18px 45px rgba(100,13,107,.12);
      --shadow2:0 10px 24px rgba(100,13,107,.09);
      --green:#16823a;
      --red:#b42318;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 0% 0%, rgba(100,13,107,.11), transparent 32%),
        radial-gradient(circle at 100% 0%, rgba(122,18,129,.09), transparent 28%),
        linear-gradient(180deg,var(--bg),#ffffff 54%,#ffffff);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    button{border:none;cursor:pointer}

    .wrap{
      width:min(1280px, calc(100% - 32px));
      margin:auto;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(255,255,255,.90);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);
    }

    .nav{
      min-height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--purple);
      color:white;
      box-shadow:0 12px 28px rgba(100,13,107,.22);
      font-size:20px;
      overflow:hidden;
      flex:0 0 auto;
      border:2px solid rgba(255,255,255,.85);
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      background:white;
    }

    .brand h1{
      font-size:18px;
      line-height:1;
      letter-spacing:-.045em;
      color:var(--purple);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:260px;
    }

    .brand p{
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:280px;
    }

    .navActions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .navLink{
      padding:9px 11px;
      border:1px solid transparent;
      color:var(--muted);
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      transition:.18s ease;
    }

    .navLink:hover{
      color:var(--purple);
      background:rgba(100,13,107,.07);
      border-color:rgba(100,13,107,.12);
    }

    .primaryBtn,.ghostBtn,.cartBtn,.secondaryBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:999px;
      font-weight:1000;
      transition:.18s ease;
      white-space:nowrap;
    }

    .primaryBtn{
      padding:11px 15px;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:white;
      box-shadow:0 12px 28px rgba(100,13,107,.22);
    }

    .primaryBtn:hover{
      transform:translateY(-1px);
      box-shadow:0 16px 34px rgba(100,13,107,.29);
    }

    .ghostBtn{
      padding:10px 13px;
      border:1px solid var(--line);
      background:white;
      color:var(--purple);
      box-shadow:0 8px 18px rgba(100,13,107,.05);
    }

    .ghostBtn:hover{
      background:#fff7ff;
      transform:translateY(-1px);
    }

    .cartBtn{
      padding:10px 12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--purple);
      font-size:13px;
      box-shadow:0 8px 18px rgba(100,13,107,.05);
    }

    .cartCount{
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:var(--purple);
      color:white;
      font-size:11px;
      font-weight:1000;
    }

    .mobileMenuBtn{display:none}

    .mobileMenu{
      display:none;
      border-top:1px solid var(--line);
      padding:10px 0 12px;
      background:rgba(255,255,255,.92);
    }

    .mobileMenu.show{
      display:grid;
      gap:8px;
    }

    .mobileMenu a{
      padding:11px 12px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:900;
      font-size:13px;
      color:var(--purple);
    }

    .page{
      padding:16px 0 32px;
    }

    .detailGrid{
      display:grid;
      grid-template-columns:.9fr 1.1fr 370px;
      gap:14px;
      align-items:start;
    }

    .imageCard,.formCard,.priceCard,.infoCard{
      border:1px solid var(--line);
      background:rgba(255,255,255,.92);
      border-radius:28px;
      box-shadow:var(--shadow2);
      overflow:hidden;
    }

    .imageCard{
      position:sticky;
      top:82px;
    }

    .imageBox{
      height:480px;
      background:#f1e4f2;
      position:relative;
      overflow:hidden;
    }

    .imageBox img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .badge{
      position:absolute;
      left:14px;
      top:14px;
      max-width:calc(100% - 28px);
      padding:8px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.90);
      backdrop-filter:blur(10px);
      color:var(--purple);
      font-size:12px;
      font-weight:1000;
      border:1px solid rgba(100,13,107,.13);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .imageInfo{
      padding:15px;
    }

    .imageInfo h2{
      color:var(--purple);
      font-size:30px;
      letter-spacing:-.06em;
      line-height:1;
      margin-bottom:8px;
    }

    .imageInfo p{
      color:var(--muted);
      line-height:1.55;
      font-size:13px;
    }

    .tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .tag{
      padding:6px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff7ff;
      color:var(--muted);
      font-size:11px;
      font-weight:900;
    }

    .cardHead{
      padding:15px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .cardHead h3{
      color:var(--purple);
      font-size:20px;
      letter-spacing:-.05em;
    }

    .cardHead p{
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .cardBody{
      padding:15px;
    }

    .formGrid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:11px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field.full{
      grid-column:1/-1;
    }

    .field label{
      color:var(--purple);
      font-size:12px;
      font-weight:1000;
    }

    .field input,.field select,.field textarea{
      width:100%;
      border:1px solid var(--line);
      outline:none;
      background:white;
      color:var(--text);
      border-radius:15px;
      padding:12px;
      min-height:45px;
      resize:vertical;
      box-shadow:0 8px 18px rgba(100,13,107,.035);
    }

    .field textarea{
      min-height:96px;
    }

    .hint{
      color:var(--muted);
      font-size:11px;
      line-height:1.45;
    }

    .addonsGrid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }

    .addonChoice{
      border:1px solid var(--line);
      background:#fff7ff;
      border-radius:16px;
      padding:10px;
      display:flex;
      align-items:flex-start;
      gap:8px;
      cursor:pointer;
      transition:.18s ease;
    }

    .addonChoice:hover{
      border-color:rgba(100,13,107,.28);
      transform:translateY(-1px);
    }

    .addonChoice input{
      margin-top:2px;
      accent-color:var(--purple);
    }

    .addonChoice b{
      display:block;
      color:var(--text);
      font-size:12px;
      margin-bottom:3px;
    }

    .addonChoice span{
      display:block;
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
    }

    .sideStack{
      display:grid;
      gap:12px;
      position:sticky;
      top:82px;
    }

    .priceLine{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:10px 0;
      border-bottom:1px solid var(--line);
      font-size:13px;
      color:var(--muted);
    }

    .priceLine b{
      color:var(--text);
      text-align:right;
    }

    .totalBox{
      margin-top:12px;
      border:1px solid rgba(100,13,107,.18);
      background:#fff7ff;
      border-radius:20px;
      padding:14px;
    }

    .totalBox span{
      display:block;
      color:var(--purple);
      font-size:12px;
      font-weight:1000;
      margin-bottom:5px;
    }

    .totalBox b{
      display:block;
      color:var(--purple);
      font-size:34px;
      letter-spacing:-.06em;
    }

    .quoteNote{
      margin-top:10px;
      border:1px solid rgba(100,13,107,.20);
      background:rgba(100,13,107,.08);
      color:var(--purple);
      border-radius:16px;
      padding:11px;
      font-size:12px;
      font-weight:850;
      line-height:1.45;
      display:none;
    }

    .quoteNote.show{
      display:block;
    }

    .policyNote{
      border:1px solid rgba(100,13,107,.16);
      background:#fff7ff;
      color:var(--muted);
      border-radius:18px;
      padding:12px;
      font-size:12px;
      font-weight:800;
      line-height:1.45;
    }

    .actionRow{
      display:grid;
      grid-template-columns:1fr;
      gap:9px;
      margin-top:12px;
    }

    .addBtn{
      width:100%;
      padding:14px 16px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:white;
      font-weight:1000;
      box-shadow:0 15px 30px rgba(100,13,107,.22);
    }

    .addBtn:hover{
      transform:translateY(-1px);
    }

    .secondaryBtn{
      width:100%;
      padding:13px 16px;
      border-radius:999px;
      background:white;
      color:var(--purple);
      font-weight:900;
      border:1px solid var(--line);
      text-align:center;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      pointer-events:none;
      z-index:200;
      max-width:min(560px,calc(100% - 24px));
      background:var(--purple);
      color:white;
      border-radius:999px;
      padding:12px 15px;
      font-size:13px;
      font-weight:1000;
      box-shadow:0 18px 36px rgba(100,13,107,.24);
      transition:.2s ease;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .empty{
      border:1px dashed rgba(100,13,107,.22);
      background:rgba(255,255,255,.78);
      border-radius:24px;
      padding:34px 18px;
      color:var(--muted);
      text-align:center;
      line-height:1.55;
      grid-column:1/-1;
      box-shadow:var(--shadow2);
    }

    .empty strong{
      color:var(--purple);
      font-size:20px;
    }

    .footer{
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.72);
      padding:18px 0;
      color:var(--muted);
      font-size:12px;
    }

    .footerInner{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
    }

    .footerBrand{
      color:var(--purple);
      font-weight:1000;
      font-size:13px;
    }

    .footerLinks{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .footerLinks a{
      color:var(--purple);
      font-weight:900;
    }

    @media(max-width:1180px){
      .detailGrid{
        grid-template-columns:1fr 1fr;
      }

      .sideStack{
        grid-column:1/-1;
        position:static;
        grid-template-columns:1fr 1fr;
      }

      .imageCard{
        position:static;
      }

      .imageBox{
        height:430px;
      }
    }

    @media(max-width:860px){
      .detailGrid{
        grid-template-columns:1fr;
      }

      .sideStack{
        grid-template-columns:1fr;
      }

      .imageBox{
        height:390px;
      }
    }

    @media(max-width:720px){
      .wrap{
        width:min(100% - 18px,1280px);
      }

      .nav{
        min-height:58px;
      }

      .brand p{
        display:none;
      }

      .brand h1{
        max-width:150px;
      }

      .navLink{
        display:none;
      }

      .mobileMenuBtn{
        display:inline-flex;
      }

      .primaryBtn{
        padding:10px 12px;
        font-size:13px;
      }

      .ghostBtn,.cartBtn{
        padding:10px 11px;
        font-size:13px;
      }

      .formGrid,.addonsGrid{
        grid-template-columns:1fr;
      }

      .imageBox{
        height:310px;
      }

      .imageInfo h2{
        font-size:26px;
      }

      .footerLinks{
        justify-content:flex-start;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <div id="siteLogo" class="logo">🍰</div>
      <div>
        <h1 id="siteBrandName">Siffat Cakes</h1>
        <p id="siteTagline">Eggless Cakes & Desserts</p>
      </div>
    </a>

    <div class="navActions">
      <a class="navLink" href="index.html">Home</a>
      <a class="navLink" href="index.html#mainCategories">Menu</a>
      <a class="navLink" href="category.html?cat=cakes">Cakes</a>
      <a class="navLink" href="cake.html?custom=true">Custom Cake</a>

      <a class="cartBtn" href="cart.html" aria-label="Open cart">
        🛒 <span class="cartCount" id="cartCount">0</span>
      </a>

      <button class="ghostBtn mobileMenuBtn" onclick="toggleMobileMenu()">Menu</button>
      <a class="primaryBtn" id="topWhatsappBtn" href="#" target="_blank">WhatsApp</a>
    </div>
  </div>

  <div class="wrap mobileMenu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="index.html#mainCategories">Main Menu</a>
    <a href="category.html?cat=cakes">Cakes</a>
    <a href="cake.html?custom=true">Create Custom Cake</a>
    <a href="cart.html">Cart</a>
  </div>
</header>

<main class="wrap page">
  <div id="mainContent" class="detailGrid">
    <div class="empty">Loading cake details...</div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footerInner">
    <div>
      <div class="footerBrand">© <span id="year"></span> <span id="footerBrand">Siffat Cakes</span></div>
      <span id="footerAddress">381 Talbot Street, St. Thomas</span>
    </div>

    <div class="footerLinks">
      <a href="index.html">Home</a>
      <a href="index.html#mainCategories">Menu</a>
      <a href="category.html?cat=cakes">Cakes</a>
      <a href="cake.html?custom=true">Custom Cake</a>
      <a href="cart.html">Cart</a>
    </div>
  </div>
</footer>

<div id="toast" class="toast"></div>

<script>
  const SUPABASE_URL = "https://rdpynngsjhzirxwzrxdd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_oPaplUdywtmujaMjyyzHTQ_6fqthIzu";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CART_KEY = "cakeShopCartV1";
  const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1200&q=80";

  const DEFAULT_SETTINGS = {
    brand_name:"Siffat Cakes",
    tagline:"Eggless Cakes & Desserts",
    logo_url:"",
    whatsapp_number:"",
    instagram_url:"",
    address:"381 Talbot Street, St. Thomas",
    business_hours:"",
    service_area:"",
    minimum_notice_hours:24,
    same_day_message:"Online orders require at least 24 hours notice. For same-day or urgent orders, please contact us directly on WhatsApp.",
    policy_text:"Online orders require at least 24 hours notice. Your order is confirmed only after the shop replies on WhatsApp. Estimated prices may change after design review.",
    currency:"$",
    show_prices:true
  };

  let siteSettings = {...DEFAULT_SETTINGS};

  let currentCake = null;
  let isCustomCake = false;

  let categories = [];
  let sizes = [];
  let flavours = [];
  let options = [];
  let addons = [];

  let cakeCategories = [];
  let cakeSizes = [];
  let cakeFlavours = [];
  let cakeAddons = [];

  const $ = (id) => document.getElementById(id);

  document.addEventListener("DOMContentLoaded", () => {
    init().catch(err => {
      console.error("Cake page init failed:", err);
      showPageError(err.message || "Unknown cake page error");
    });
  });

  async function init(){
    $("year").textContent = new Date().getFullYear();

    updateCartCount();

    const params = new URLSearchParams(window.location.search);
    const cakeId = params.get("id");

    isCustomCake = params.get("custom") === "true" || params.get("type") === "custom";

    await loadData(cakeId);
    applySettings();

    if(!isCustomCake && !currentCake){
      showNotFound();
      return;
    }

    renderPage();
    updatePrice();
  }

  async function loadData(cakeId){
    const queries = [
      supabaseClient.from("site_settings").select("*").eq("id", 1).maybeSingle(),
      supabaseClient.from("categories").select("*").eq("is_active", true).order("sort_order", { ascending:true }).order("name", { ascending:true }),
      supabaseClient.from("sizes").select("*").eq("is_active", true).order("sort_order", { ascending:true }).order("name", { ascending:true }),
      supabaseClient.from("flavours").select("*").eq("is_active", true).order("sort_order", { ascending:true }).order("name", { ascending:true }),
      supabaseClient.from("cake_options").select("*").eq("is_active", true).order("sort_order", { ascending:true }).order("name", { ascending:true }),
      supabaseClient.from("addons").select("*").eq("is_active", true).order("sort_order", { ascending:true }).order("name", { ascending:true }),
      supabaseClient.from("cake_categories").select("*"),
      supabaseClient.from("cake_sizes").select("*"),
      supabaseClient.from("cake_flavours").select("*"),
      supabaseClient.from("cake_addons").select("*")
    ];

    if(cakeId && !isCustomCake){
      queries.push(
        supabaseClient
          .from("cakes")
          .select("*")
          .eq("id", cakeId)
          .eq("is_active", true)
          .maybeSingle()
      );
    }

    const results = await Promise.all(queries);

    const [
      settingsRes,
      categoriesRes,
      sizesRes,
      flavoursRes,
      optionsRes,
      addonsRes,
      cakeCategoriesRes,
      cakeSizesRes,
      cakeFlavoursRes,
      cakeAddonsRes,
      cakeRes
    ] = results;

    if(settingsRes.error){
      console.warn("Settings load issue:", settingsRes.error.message);
    }else{
      siteSettings = {...DEFAULT_SETTINGS, ...(settingsRes.data || {})};
    }

    if(categoriesRes.error) throw new Error("Categories error: " + categoriesRes.error.message);
    if(sizesRes.error) throw new Error("Sizes error: " + sizesRes.error.message);
    if(flavoursRes.error) throw new Error("Flavours error: " + flavoursRes.error.message);
    if(optionsRes.error) throw new Error("Options error: " + optionsRes.error.message);
    if(addonsRes.error) throw new Error("Add-ons error: " + addonsRes.error.message);

    categories = Array.isArray(categoriesRes.data) ? categoriesRes.data : [];
    sizes = Array.isArray(sizesRes.data) ? sizesRes.data : [];
    flavours = Array.isArray(flavoursRes.data) ? flavoursRes.data : [];
    options = Array.isArray(optionsRes.data) ? optionsRes.data : [];
    addons = Array.isArray(addonsRes.data) ? addonsRes.data : [];

    cakeCategories = cakeCategoriesRes.error ? [] : (cakeCategoriesRes.data || []);
    cakeSizes = cakeSizesRes.error ? [] : (cakeSizesRes.data || []);
    cakeFlavours = cakeFlavoursRes.error ? [] : (cakeFlavoursRes.data || []);
    cakeAddons = cakeAddonsRes.error ? [] : (cakeAddonsRes.data || []);

    if(cakeRes){
      if(cakeRes.error) throw new Error("Cake error: " + cakeRes.error.message);
      currentCake = cakeRes.data || null;
    }
  }

  function applySettings(){
    const brand = siteSettings.brand_name || DEFAULT_SETTINGS.brand_name;
    const tagline = siteSettings.tagline || DEFAULT_SETTINGS.tagline;
    const logo = siteSettings.logo_url || "";
    const whatsapp = normalizePhone(siteSettings.whatsapp_number || "");

    $("siteBrandName").textContent = brand;
    $("siteTagline").textContent = tagline;
    $("footerBrand").textContent = brand;
    $("footerAddress").textContent = buildFooterInfo();

    if(logo){
      $("siteLogo").innerHTML = `<img src="${escapeHtml(logo)}" alt="${escapeHtml(brand)}" onerror="this.parentElement.textContent='🍰'">`;
    }else{
      $("siteLogo").textContent = "🍰";
    }

    setupWhatsappLinks(whatsapp);
  }

  function renderPage(){
    const cakeName = isCustomCake ? "Custom Cake Request" : (currentCake.name || "Custom Cake");

    const cakeDescription = isCustomCake
      ? "Create a custom cake from scratch. Add your design idea, size, flavour, message and special notes."
      : (currentCake.description || "Fresh custom cake made on order.");

    const cakeImage = isCustomCake ? FALLBACK_IMAGE : (currentCake.image_url || FALLBACK_IMAGE);
    const catNames = isCustomCake ? ["Custom Cake"] : getCakeCategoryNames(currentCake.id);

    document.title = `${cakeName} - ${siteSettings.brand_name || "Siffat Cakes"}`;

    $("mainContent").innerHTML = `
      <section class="imageCard">
        <div class="imageBox">
          <img id="cakeImagePreview" src="${escapeHtml(cakeImage)}" alt="${escapeHtml(cakeName)}" onerror="this.src='${FALLBACK_IMAGE}'">
          <div class="badge">${escapeHtml(catNames[0] || "Cake")}${!isCustomCake && currentCake.is_featured ? " · Featured" : ""}</div>
        </div>

        <div class="imageInfo">
          <h2>${escapeHtml(cakeName)}</h2>
          <p>${escapeHtml(cakeDescription)}</p>

          <div class="tags">
            ${catNames.slice(0,3).map(name => `<span class="tag">${escapeHtml(name)}</span>`).join("")}
            <span class="tag">${isCustomCake ? "custom request" : "customizable"}</span>
            <span class="tag">${isCustomCake ? "quote possible" : escapeHtml(currentCake.price_type || "estimated")}</span>
          </div>
        </div>
      </section>

      <section class="formCard">
        <div class="cardHead">
          <div>
            <h3>Customize Your Cake</h3>
            <p>Select size, flavour, option, add-ons and notes. Estimated price updates live.</p>
          </div>
        </div>

        <div class="cardBody">
          <form id="customForm" class="formGrid">
            ${isCustomCake ? `
              <div class="field full">
                <label>Custom Cake Title *</label>
                <input id="customCakeTitle" required placeholder="Pink princess cake, car theme cake, engagement cake...">
              </div>
            ` : ""}

            <div class="field">
              <label>Cake Size *</label>
              <select id="sizeSelect" required onchange="updatePrice()">
                ${buildSizeOptions()}
              </select>
              <div class="hint">Servings and base price are controlled by admin.</div>
            </div>

            <div class="field">
              <label>Flavour</label>
              <select id="flavourSelect" onchange="updatePrice()">
                ${buildFlavourOptions()}
              </select>
            </div>

            <div class="field">
              <label>Option</label>
              <select id="optionSelect" onchange="updatePrice()">
                ${buildOptionOptions()}
              </select>
            </div>

            <div class="field">
              <label>Quantity</label>
              <input id="quantityInput" type="number" min="1" value="1" oninput="updatePrice()">
            </div>

            <div class="field full">
              <label>Message on Cake</label>
              <input id="cakeMessageInput" placeholder="Happy Birthday, Congratulations, Baby Shower, etc.">
            </div>

            <div class="field full">
              <label>Special Notes</label>
              <textarea id="notesInput" placeholder="Add theme, colours, allergy notes, design details, inspiration photo link, pickup notes, budget range, or anything special here."></textarea>
              <div class="hint">Use this one box for design/theme/colour/photo link/allergy details instead of separate confusing fields.</div>
            </div>

            <div class="field full">
              <label>Add-ons</label>
              <div id="addonsGrid" class="addonsGrid">
                ${buildAddonChoices()}
              </div>
              <div class="hint">Quote-required add-ons may change final price after shop review.</div>
            </div>
          </form>
        </div>
      </section>

      <aside class="sideStack">
        <div class="priceCard">
          <div class="cardHead">
            <div>
              <h3>Estimated Price</h3>
              <p>This is not final confirmation. Shop will review and confirm on WhatsApp.</p>
            </div>
          </div>

          <div class="cardBody">
            <div id="priceBreakdown"></div>

            <div class="totalBox">
              <span>Estimated Item Total</span>
              <b id="estimatedTotal">$0</b>
            </div>

            <div id="quoteNote" class="quoteNote">
              Some selected options require a custom quote. Final price will be confirmed by the shop.
            </div>

            <div class="actionRow">
              <button class="addBtn" onclick="addToCart()">Add to Cart</button>
              <button class="secondaryBtn" onclick="addToCart(true)">Add & Go to Cart</button>
            </div>
          </div>
        </div>

        <div class="infoCard">
          <div class="cardBody">
            <div class="policyNote">
              ${escapeHtml(siteSettings.policy_text || DEFAULT_SETTINGS.policy_text)}
              <br><br>
              ${escapeHtml(siteSettings.same_day_message || DEFAULT_SETTINGS.same_day_message)}
            </div>

            <div class="actionRow">
              <a class="secondaryBtn" id="sideWhatsappBtn" href="#" target="_blank">Need Today? WhatsApp</a>
              <a class="secondaryBtn" href="category.html?cat=cakes">Back to Cakes</a>
            </div>
          </div>
        </div>
      </aside>
    `;

    setupSideWhatsapp();
  }

  function buildSizeOptions(){
    const availableSizes = getAvailableSizes();

    if(!availableSizes.length){
      return `<option value="">No sizes available</option>`;
    }

    return `
      <option value="">Select size</option>
      ${availableSizes.map(size => {
        const price = Number(size.price || 0);
        const priceText = size.quote_required ? "Quote required" : money(price);
        const label = `${size.name}${size.servings ? " — " + size.servings : ""} — ${priceText}`;
        return `<option value="${escapeHtml(size.id)}">${escapeHtml(label)}</option>`;
      }).join("")}
    `;
  }

  function buildFlavourOptions(){
    const availableFlavours = getAvailableFlavours();

    if(!availableFlavours.length){
      return `<option value="">No flavours available</option>`;
    }

    return `
      <option value="">Select flavour</option>
      ${availableFlavours.map(flavour => {
        const extra = Number(flavour.extra_price || 0);
        const priceText = flavour.quote_required ? "Quote required" : (extra ? "+" + money(extra) : "+$0");
        return `<option value="${escapeHtml(flavour.id)}">${escapeHtml(flavour.name + " — " + priceText)}</option>`;
      }).join("")}
      <option value="not_sure">Not sure / Need suggestion</option>
    `;
  }

  function buildOptionOptions(){
    if(!options.length){
      return `<option value="">No options available</option>`;
    }

    return `
      <option value="">Select option</option>
      ${options.map(option => {
        const extra = Number(option.extra_price || 0);
        const priceText = option.quote_required ? "Quote required" : (extra ? "+" + money(extra) : "+$0");
        return `<option value="${escapeHtml(option.id)}">${escapeHtml(option.name + " — " + priceText)}</option>`;
      }).join("")}
    `;
  }

  function buildAddonChoices(){
    const availableAddons = getAvailableAddons();

    if(!availableAddons.length){
      return `<div class="hint">No add-ons available.</div>`;
    }

    return availableAddons.map(addon => {
      const price = Number(addon.price || 0);
      const priceText = addon.quote_required ? "Quote required" : (price ? "+" + money(price) : "+$0");

      return `
        <label class="addonChoice">
          <input type="checkbox" value="${escapeHtml(addon.id)}" onchange="updatePrice()">
          <div>
            <b>${escapeHtml(addon.name)} · ${escapeHtml(priceText)}</b>
            <span>${escapeHtml(addon.description || "Optional add-on")}</span>
          </div>
        </label>
      `;
    }).join("");
  }

  function getAvailableSizes(){
    if(isCustomCake) return sizes;

    const ids = cakeSizes
      .filter(row => String(row.cake_id) === String(currentCake.id))
      .map(row => String(row.size_id));

    if(!ids.length) return sizes;

    return sizes.filter(size => ids.includes(String(size.id)));
  }

  function getAvailableFlavours(){
    if(isCustomCake) return flavours;

    const ids = cakeFlavours
      .filter(row => String(row.cake_id) === String(currentCake.id))
      .map(row => String(row.flavour_id));

    if(!ids.length) return flavours;

    return flavours.filter(flavour => ids.includes(String(flavour.id)));
  }

  function getAvailableAddons(){
    if(isCustomCake) return addons;

    const ids = cakeAddons
      .filter(row => String(row.cake_id) === String(currentCake.id))
      .map(row => String(row.addon_id));

    if(!ids.length) return addons;

    return addons.filter(addon => ids.includes(String(addon.id)));
  }

  function updatePrice(){
    const selectedSize = getSelectedSize();
    const selectedFlavour = getSelectedFlavour();
    const selectedOption = getSelectedOption();
    const selectedAddons = getSelectedAddons();
    const quantity = Math.max(1, Number($("quantityInput")?.value || 1));

    const sizePrice = selectedSize ? Number(selectedSize.price || 0) : 0;
    const flavourExtra = selectedFlavour ? Number(selectedFlavour.extra_price || 0) : 0;
    const optionExtra = selectedOption ? Number(selectedOption.extra_price || 0) : 0;
    const addonTotal = selectedAddons.reduce((sum, addon) => sum + Number(addon.price || 0), 0);

    const unitTotal = sizePrice + flavourExtra + optionExtra + addonTotal;
    const estimatedTotal = unitTotal * quantity;

    const quoteRequired =
      !selectedSize ||
      selectedSize?.quote_required === true ||
      selectedFlavour?.quote_required === true ||
      selectedOption?.quote_required === true ||
      selectedAddons.some(addon => addon.quote_required === true);

    const rows = [];

    rows.push({
      label: selectedSize
        ? `${selectedSize.name}${selectedSize.servings ? " · " + selectedSize.servings : ""}`
        : "Cake size",
      value: selectedSize ? (selectedSize.quote_required ? "Quote" : money(sizePrice)) : "Select"
    });

    rows.push({
      label: getFlavourLabel(),
      value: selectedFlavour ? (selectedFlavour.quote_required ? "Quote" : "+" + money(flavourExtra)) : "Not priced"
    });

    rows.push({
      label: selectedOption ? selectedOption.name : "Option",
      value: selectedOption ? (selectedOption.quote_required ? "Quote" : "+" + money(optionExtra)) : "Not selected"
    });

    if(selectedAddons.length){
      selectedAddons.forEach(addon => {
        rows.push({
          label: addon.name,
          value: addon.quote_required ? "Quote" : "+" + money(addon.price)
        });
      });
    }else{
      rows.push({
        label: "Add-ons",
        value: "None"
      });
    }

    rows.push({
      label: "Quantity",
      value: "× " + quantity
    });

    $("priceBreakdown").innerHTML = rows.map(row => `
      <div class="priceLine">
        <span>${escapeHtml(row.label)}</span>
        <b>${escapeHtml(row.value)}</b>
      </div>
    `).join("");

    $("estimatedTotal").textContent = quoteRequired ? "Quote" : money(estimatedTotal);
    $("quoteNote").classList.toggle("show", quoteRequired);

    return {
      selectedSize,
      selectedFlavour,
      selectedOption,
      selectedAddons,
      quantity,
      sizePrice,
      flavourExtra,
      optionExtra,
      addonTotal,
      estimatedTotal,
      quoteRequired
    };
  }

  function addToCart(goToCart = false){
    const priceData = updatePrice();

    if(!priceData.selectedSize){
      showToast("Please select cake size first.", true);
      return;
    }

    const customTitleInput = $("customCakeTitle");

    const cakeName = isCustomCake
      ? (customTitleInput?.value.trim() || "")
      : (currentCake.name || "Cake");

    if(isCustomCake && !cakeName){
      showToast("Please enter custom cake title.", true);
      customTitleInput.focus();
      return;
    }

    const cart = getCart();

    const flavourName = getFlavourLabel();
    const image = isCustomCake ? FALLBACK_IMAGE : (currentCake.image_url || FALLBACK_IMAGE);

    const item = {
      cart_item_id:createId(),
      cart_id:createId(),
      item_type:"custom_cake",
      product_type:"custom_cake",

      cake_id:isCustomCake ? null : currentCake.id,
      cake_name:cakeName,
      name:cakeName,
      cake_image:image,
      image_url:image,
      is_custom:isCustomCake,

      selected_size_id:priceData.selectedSize?.id || "",
      selected_size_name:priceData.selectedSize?.name || "",
      selected_servings:priceData.selectedSize?.servings || "",
      selected_size_price:Number(priceData.sizePrice || 0),
      size_quote_required:priceData.selectedSize?.quote_required === true,

      selected_flavour_id:priceData.selectedFlavour?.id || "",
      selected_flavour_name:flavourName === "Flavour" ? "" : flavourName,
      flavour:flavourName === "Flavour" ? "" : flavourName,
      flavour_extra_price:Number(priceData.flavourExtra || 0),
      flavour_quote_required:priceData.selectedFlavour?.quote_required === true,

      selected_option_id:priceData.selectedOption?.id || "",
      selected_option_name:priceData.selectedOption?.name || "",
      option_extra_price:Number(priceData.optionExtra || 0),
      option_quote_required:priceData.selectedOption?.quote_required === true,

      selected_addons:priceData.selectedAddons.map(addon => ({
        id:addon.id,
        name:addon.name,
        price:Number(addon.price || 0),
        quote_required:addon.quote_required === true
      })),

      message_on_cake:$("cakeMessageInput").value.trim(),
      theme_notes:"",
      inspiration_photo_link:"",
      special_notes:$("notesInput").value.trim(),

      quantity:priceData.quantity,
      estimated_item_total:Number(priceData.estimatedTotal || 0),
      estimated_total:Number(priceData.estimatedTotal || 0),
      price_type:priceData.quoteRequired ? "quote" : "estimated",
      quote_required:priceData.quoteRequired === true,
      added_at:new Date().toISOString()
    };

    cart.push(item);
    saveCart(cart);
    updateCartCount();

    showToast("Cake added to cart.");

    if(goToCart){
      window.location.href = "cart.html";
    }
  }

  function getSelectedSize(){
    const value = $("sizeSelect")?.value || "";
    return sizes.find(size => String(size.id) === String(value)) || null;
  }

  function getSelectedFlavour(){
    const value = $("flavourSelect")?.value || "";

    if(!value || value === "not_sure"){
      return null;
    }

    return flavours.find(flavour => String(flavour.id) === String(value)) || null;
  }

  function getFlavourLabel(){
    const value = $("flavourSelect")?.value || "";

    if(value === "not_sure"){
      return "Not sure / Need suggestion";
    }

    const selected = getSelectedFlavour();

    if(selected) return selected.name;

    return "Flavour";
  }

  function getSelectedOption(){
    const value = $("optionSelect")?.value || "";
    return options.find(option => String(option.id) === String(value)) || null;
  }

  function getSelectedAddons(){
    const checked = Array.from(document.querySelectorAll("#addonsGrid input[type='checkbox']:checked")).map(input => input.value);
    return addons.filter(addon => checked.includes(String(addon.id)));
  }

  function getCakeCategoryNames(cakeId){
    const ids = cakeCategories
      .filter(row => String(row.cake_id) === String(cakeId))
      .map(row => row.category_id);

    return ids
      .map(id => categories.find(cat => String(cat.id) === String(id))?.name)
      .filter(Boolean);
  }

  function showNotFound(){
    $("mainContent").innerHTML = `
      <div class="empty">
        <strong>Cake not found.</strong><br>
        This cake does not exist or is currently inactive.<br><br>
        <a class="primaryBtn" href="category.html?cat=cakes">View Cakes</a>
      </div>
    `;
  }

  function showPageError(message){
    $("mainContent").innerHTML = `
      <div class="empty">
        <strong>Page error</strong><br>
        ${escapeHtml(message)}<br><br>
        Open browser console for details.
      </div>
    `;
  }

  function setupWhatsappLinks(phone){
    const normalMessage = "Hi, I want to ask about a cake or dessert order.";
    const normalUrl = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(normalMessage)}` : "#";

    const top = $("topWhatsappBtn");
    if(!top) return;

    top.href = normalUrl;
    top.onclick = phone ? null : function(e){
      e.preventDefault();
      showToast("WhatsApp number is not added yet.", true);
    };
  }

  function setupSideWhatsapp(){
    const sideWhatsapp = $("sideWhatsappBtn");
    if(!sideWhatsapp) return;

    const phone = normalizePhone(siteSettings.whatsapp_number || "");

    if(phone){
      sideWhatsapp.href = `https://wa.me/${phone}?text=${encodeURIComponent("Hi, I need a same-day or urgent cake order. Can you please confirm availability?")}`;
      sideWhatsapp.onclick = null;
    }else{
      sideWhatsapp.href = "#";
      sideWhatsapp.onclick = function(e){
        e.preventDefault();
        showToast("WhatsApp number is not added yet.", true);
      };
    }
  }

  function buildFooterInfo(){
    const parts = [];

    if(siteSettings.address) parts.push(siteSettings.address);
    if(siteSettings.service_area) parts.push("Serving " + siteSettings.service_area);
    if(siteSettings.business_hours) parts.push(siteSettings.business_hours);

    return parts.length ? parts.join(" · ") : "381 Talbot Street, St. Thomas";
  }

  function getCart(){
    try{
      const raw = localStorage.getItem(CART_KEY);
      const parsed = JSON.parse(raw || "[]");
      return Array.isArray(parsed) ? parsed : [];
    }catch{
      return [];
    }
  }

  function saveCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function updateCartCount(){
    const cart = getCart();
    const count = cart.reduce((sum,item) => sum + Number(item.quantity || 1), 0);
    $("cartCount").textContent = count;
  }

  function money(value){
    const symbol = siteSettings.currency || "$";
    const num = Number(value || 0);
    return symbol + num.toFixed(2).replace(".00","");
  }

  function createId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "cart-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function toggleMobileMenu(){
    $("mobileMenu").classList.toggle("show");
  }

  function normalizePhone(value){
    return String(value || "").replace(/[^\d]/g, "");
  }

  function showToast(message, isError = false){
    const toast = $("toast");
    toast.textContent = message;
    toast.style.background = isError ? "var(--red)" : "var(--purple)";
    toast.classList.add("show");

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2400);
  }

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
